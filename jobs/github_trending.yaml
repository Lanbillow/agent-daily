# 09:00 每日任务：采集 GitHub 热门项目 + 中文摘要 + 生成快报
job: github_trending
schedule: "09:00"
model: local

workflow:
  steps:
    # 1. 采集热榜
    - id: collect
      type: tool
      tool: github_trending
      args:
        since: daily
        limit: 10

    # 2. 保存原始数据工件
    - id: save_raw
      type: artifact
      action: save
      name: trending_raw
      artifact_type: json
      date: ${date}
      content: ${collect}

    # 3. 逐条中文摘要（batch：对 collect 列表逐项渲染 summarize_repo）
    - id: summarize
      type: model
      prompt: summarize_repo
      batch: true
      input: ${collect}
      result_key: summary
      system: "只输出最终的一句中文摘要，不展示分析或思考过程。"
      max_tokens: 96
      temperature: 0.0
      map:
        repo_name: ${item.name}
        description: ${item.description}
        language: ${item.language}
        stars: ${item.stars}

    # 4. 清洗模型输出（去思考过程、模板化开头和重复元数据）
    - id: normalize
      type: tool
      tool: normalize_summaries
      args:
        items: ${summarize}

    # 5. 保存摘要工件
    - id: save_summaries
      type: artifact
      action: save
      name: summaries
      artifact_type: json
      date: ${date}
      content: ${normalize}

    # 6. 确定性组织快报正文（小模型不再承担长上下文二次生成）
    - id: compose
      type: tool
      tool: compose_report
      args:
        date: ${date}
        summaries: ${normalize}

    # 7. 保存报告工件
    - id: save_report
      type: artifact
      action: save
      name: report
      artifact_type: markdown
      date: ${date}
      content: ${compose}

outputs:
  - {name: trending_raw, type: json}
  - {name: summaries, type: json}
  - {name: report, type: markdown}
