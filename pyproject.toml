[project]
name = "agent-daily"
version = "0.1.0"
description = "Personal AI agent system running on macOS (Apple Silicon)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.scripts]
agent-daily = "agent_daily.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_daily"]
